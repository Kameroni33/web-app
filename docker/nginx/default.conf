server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 10m;

    # Laravel: API, Sanctum CSRF cookie, health check.
    # nginx never sees the PHP files; php-fpm resolves the script path in its own container.
    location ~ ^/(api|sanctum|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_pass app:9000;
    }

    # Vite emits content-hashed filenames here.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icons whose names carry a hash of the logo (pwa-assets.config.ts).
    location ~ "^/[a-z0-9-]+-[0-9a-f]{8}\.(png|ico|svg)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell, service worker and manifest must be revalidated on every
    # load, or browsers keep running the old version after a deploy.
    location ~ ^/(index\.html|sw\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        # nginx's mime.types has no entry for web app manifests.
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: every other path is a Vue route. Anything else served
    # from here keeps its name across deploys, so caches (browsers and
    # Cloudflare's edge, which caches .svg/.png by default) must revalidate.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
